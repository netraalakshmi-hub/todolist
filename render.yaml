services:
  - type: web
    name: todolistap
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --prefix backend && npm install --prefix react-app && npm run build --prefix react-app
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: todolistap-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1